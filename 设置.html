
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脉络 - 设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F9FAFB;
            color: #1F2937;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .ios-status-bar {
            height: 44px;
            background-color: #F9FAFB;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .tab-bar {
            height: 84px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #E5E7EB;
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 30px;
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6B7280;
            font-size: 10px;
        }
        
        .tab-item.active {
            color: #3B82F6;
        }
        
        .tab-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .content-area {
            height: calc(100vh - 128px);
            overflow-y: auto;
            padding: 0 0 100px;
        }
        
        .settings-section {
            background-color: white;
            margin-bottom: 16px;
        }
        
        .settings-header {
            padding: 12px 16px 8px;
            font-size: 14px;
            text-transform: uppercase;
            color: #6B7280;
            font-weight: 600;
        }
        
        .settings-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #F3F4F6;
        }
        
        .settings-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 30px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #E5E7EB;
            transition: .4s;
            border-radius: 34px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #3B82F6;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }
        
        .avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            object-fit: cover;
        }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-blue {
            background-color: #EBF5FF;
            color: #3B82F6;
        }
    </style>
</head>
<body>
    <!-- iOS Status Bar -->
    <div class="ios-status-bar">
        <span>9:41</span>
        <div>
            <span class="mr-2"><i class="fas fa-signal"></i></span>
            <span class="mr-2"><i class="fas fa-wifi"></i></span>
            <span><i class="fas fa-battery-full"></i></span>
        </div>
    </div>
    
    <!-- App Header -->
    <div class="px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">设置</h1>
        </div>
    </div>
    
    <!-- Main Content Area -->
    <div class="content-area">
        <!-- Profile Section -->
        <div class="settings-section mb-6">
            <div class="flex items-center p-4">
                <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=crop&w=200&q=80" class="avatar-large mr-4">
                <div>
                    <h2 class="text-xl font-bold">张三</h2>
                    <p class="text-gray-500 mb-1">zhangsan@example.com</p>
                    <div class="badge badge-blue">专业版</div>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </div>
        </div>
        
        <!-- Data & Privacy -->
        <div class="settings-section">
            <div class="settings-header">数据与隐私</div>
            
            <div class="settings-item">
                <div class="settings-icon bg-blue-100">
                    <i class="
